name: Android check

# Compiles the app on a work branch without releasing anything: main alone publishes builds.
on:
  push:
    branches: ["kmp*"]
    paths:
      - "android/**"
      - ".github/workflows/android-check.yml"
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # Compiling needs no bridge: a placeholder passes the APK's own check for it.
      - name: Placeholder bridge library
        run: |
          mkdir -p android/app/src/androidMain/jniLibs/arm64-v8a
          touch android/app/src/androidMain/jniLibs/arm64-v8a/libmoonmobile.so
      - name: Debug APK
        working-directory: android
        run: bash ./gradlew --no-daemon assembleDebug

  # The shared code for the iPhone, compiled on Linux as far as that goes (no framework link).
  ios-klib:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: iosArm64 klib
        working-directory: android
        run: bash ./gradlew --no-daemon :app:compileKotlinIosArm64 -Pkotlin.native.enableKlibsCrossCompilation=true
